# PI
- name: Hideaki Tsutsui
  role: Professor
  image: ../assets/images/team/HideakiTsutsui.jpg
  email: tsutsui@ucr.edu
  status: PI
  position: pi
  year_joined: 2011
  cv: ../assets/pdfs/Hideaki_Tsutsui_CV.pdf
  scholar: https://scholar.google.com/citations?user=Trw76bsAAAAJ&hl=en
  bio:  "Hideaki is a Professor of Mechanical Engineering at the University of California, Riverside, and a participating faculty member in the Bioengineering Interdepartmental Graduate Program and the UCR Stem Cell Center. He received his B.E. from the University of Tokyo (2001), M.S. from UC San Diego (2003), and Ph.D. from UCLA (2009), and completed postdoctoral research at UCLA. His research focuses on biosensors and microfluidic tools for agricultural and medical disease diagnostics. He is a recipient of a Bill & Melinda Gates Foundation Grand Challenges Explorations Phase I Award (2012) and an NSF CAREER Award (2017), was named an <em>Industrial & Engineering Chemistry Research</em> Influential Researcher (2018). He serves on the editorial boards of <em>SLAS Technology</em> and <em>Microsystems & Nanoengineering</em>." 

